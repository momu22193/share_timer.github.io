</div>

<script>

    const FOCUS_TIME = 50 * 60;
    const BREAK_TIME = 10 * 60;

    let mode = "focus";
    let remainingSeconds = FOCUS_TIME;
    let setCount = 1;

    let timerId = null;
    let endTime = null;


    // ------------------------------------------
    // 表示更新
    // ------------------------------------------

    function updateDisplay() {

        const minutes =
            Math.floor(remainingSeconds / 60);

        const seconds =
            remainingSeconds % 60;

        document.getElementById("time").textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

        document.getElementById("mode").textContent =
            mode === "focus"
                ? "集中"
                : "休憩";

        document.getElementById("set").textContent =
            "SET " + setCount;
    }


    // ------------------------------------------
    // タイマー開始
    // ------------------------------------------

    function startTimer() {

        if (timerId !== null) {
            return;
        }

        endTime =
            Date.now() +
            remainingSeconds * 1000;

        timerId =
            setInterval(updateTimer, 200);
    }


    // ------------------------------------------
    // タイマー処理
    // ------------------------------------------

    function updateTimer() {

        const diff =
            endTime - Date.now();

        remainingSeconds =
            Math.max(
                0,
                Math.ceil(diff / 1000)
            );

        if (diff <= 0) {

            switchMode();

            return;
        }

        updateDisplay();
    }


    // ------------------------------------------
    // 一時停止
    // ------------------------------------------

    function pauseTimer() {

        if (timerId === null) {
            return;
        }

        const diff =
            endTime - Date.now();

        remainingSeconds =
            Math.max(
                0,
                Math.ceil(diff / 1000)
            );

        clearInterval(timerId);

        timerId = null;
        endTime = null;

        updateDisplay();
    }


    // ------------------------------------------
    // リセット
    // ------------------------------------------

    function resetTimer() {

        pauseTimer();

        mode = "focus";
        remainingSeconds = FOCUS_TIME;
        setCount = 1;

        updateDisplay();
    }


    // ------------------------------------------
    // 集中 ⇔ 休憩
    // ------------------------------------------

    function switchMode() {

        clearInterval(timerId);

        timerId = null;

        if (mode === "focus") {

            mode = "break";
            remainingSeconds = BREAK_TIME;

        } else {

            mode = "focus";
            remainingSeconds = FOCUS_TIME;

            setCount++;
        }

        updateDisplay();

        startTimer();

        notify();
    }


    // ------------------------------------------
    // 通知
    // ------------------------------------------

    function notify() {

        if (!("Notification" in window)) {
            return;
        }

        if (Notification.permission === "granted") {

            new Notification(
                mode === "focus"
                    ? "集中時間スタート"
                    : "休憩時間スタート"
            );
        }
    }


    // ------------------------------------------
    // 通知許可
    // ------------------------------------------

    function requestNotificationPermission() {

        if (!("Notification" in window)) {
            return;
        }

        if (Notification.permission === "default") {

            Notification.requestPermission();
        }
    }


    // ------------------------------------------
    // ボタン
    // ------------------------------------------

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            () => {

                requestNotificationPermission();

                startTimer();
            }
        );


    document
        .getElementById("pauseButton")
        .addEventListener(
            "click",
            pauseTimer
        );


    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            resetTimer
        );


    // ------------------------------------------
    // Service Worker登録
    // ------------------------------------------

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            () => {

                navigator.serviceWorker
                    .register("sw.js")
                    .then(() => {

                        console.log(
                            "Service Worker registered."
                        );

                    })
                    .catch((error) => {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    });
            }
        );
    }


    // ------------------------------------------
    // 初期表示
    // ------------------------------------------

    updateDisplay();

</script>

</body>
